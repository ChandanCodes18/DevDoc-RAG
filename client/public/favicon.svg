<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft blur to mix the colors like a fluid WebGL shader -->
    <filter id="fluidBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    
    <!-- Clipping to a perfect sphere -->
    <clipPath id="orbClip">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
    
    <!-- Subtle outer glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer atmospheric glow -->
  <circle cx="32" cy="32" r="32" fill="url(#glow)" opacity="0.3" />

  <!-- The core fluid orb -->
  <g clip-path="url(#orbClip)">
    <!-- Base deep space color -->
    <rect width="64" height="64" fill="#17122b" />
    
    <!-- Fluid gradient blobs simulating the WebGL orb -->
    <circle cx="16" cy="16" r="32" fill="#3b82f6" filter="url(#fluidBlur)" opacity="0.95" />
    <circle cx="50" cy="48" r="28" fill="#8b5cf6" filter="url(#fluidBlur)" opacity="0.95" />
    <circle cx="12" cy="50" r="24" fill="#ec4899" filter="url(#fluidBlur)" opacity="0.85" />
    <circle cx="48" cy="12" r="26" fill="#06b6d4" filter="url(#fluidBlur)" opacity="0.85" />
    <circle cx="32" cy="32" r="16" fill="#ffffff" filter="url(#fluidBlur)" opacity="0.6" />
  </g>
</svg>